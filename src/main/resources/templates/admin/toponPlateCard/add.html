<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('门楼牌号段立卡登记')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">段卡号</label>
                    <div class="layui-input-block">
                        <input type="text" name="billNo" lay-verify="required" autocomplete="off"
                               placeholder="段卡号（系统不代填，请如实录入）" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">所属档案</label>
                    <div class="layui-input-block">
                        <select name="siteId" id="siteId" lay-verify="required">
                            <option value="">请选择乡镇街道基础档案</option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">可编号数</label>
                    <div class="layui-input-block">
                        <input type="number" name="qty" lay-verify="required" autocomplete="off"
                               placeholder="单侧和双侧合起来可编多少个号" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">本年度新编</label>
                    <div class="layui-input-block">
                        <input type="number" name="fineAmt" autocomplete="off"
                               placeholder="本年度新编号码个数" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入备注" name="remark" class="layui-textarea"></textarea>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="toponPlateCard-save">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath+"/ToponPlateCardController";

        //立卡只认有档案的：下拉只列在用的乡镇街道基础档案
        $.ajax({
            url: MODULE_PATH+'/docOptions',
            dataType: 'json',
            type: 'get',
            success: function (result) {
                if (result.code == 200 && result.data) {
                    $.each(result.data, function (i, doc) {
                        $('#siteId').append('<option value="'+doc.id+'">'+doc.siteName+'（'+doc.siteNo+'）</option>');
                    });
                    form.render('select');
                }
            }
        });

        //保存：成与不成，页面原样亮出接口回话，不得涂改
        form.on('submit(toponPlateCard-save)', function (data) {
            $.ajax({
                url: MODULE_PATH+'/add',
                data: data.field,
                dataType: 'json',
                contentType: 'application/x-www-form-urlencoded',
                type: 'post',
                success: function (result) {
                    if (result.code==200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));//关闭当前页
                            parent.layui.table.reload("toponPlateCard-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2000});
                    }
                }
            })
            return false;
        });
    })
</script>
</body>
